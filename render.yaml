services:
  - type: web
    name: omnixml-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 web_app_browser:app
    envVars:
      - key: OMNIXML_TRUST_PROXY
        value: "1"
      - key: OMNIXML_SEFAZ_TOKEN
        sync: false
    healthCheckPath: /health
    autoDeployTrigger: commit
