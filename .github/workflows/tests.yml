name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Materializar UX SPED v23
        if: github.event_name == 'pull_request' && github.head_ref == 'ux-sped-v23-conservative'
        run: |
          python tools/apply_sped_v23.py
          if ! git diff --quiet -- templates/dashboard.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add templates/dashboard.html
            git commit -m "feat: materializa UX SPED v23"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit dependencies
        run: pip-audit -r requirements-prod.txt
      - name: Run tests
        run: pytest -q
