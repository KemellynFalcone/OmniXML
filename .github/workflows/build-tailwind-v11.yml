name: Build Tailwind v11

on:
  push:
    branches:
      - security-phase11-local-tailwind
    paths:
      - 'assets/tailwind_v11.css'
      - 'tailwind.config.js'
      - 'package.json'
      - 'templates/**'
      - 'static/**/*.js'
      - '.github/workflows/build-tailwind-v11.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-phase11-local-tailwind
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build:tailwind
      - name: Commit compiled CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/tailwind_v11.css package-lock.json
          if git diff --cached --quiet; then
            echo "Tailwind CSS already up to date"
            exit 0
          fi
          git commit -m "build: gerar Tailwind CSS local v11"
          git push origin HEAD:security-phase11-local-tailwind
